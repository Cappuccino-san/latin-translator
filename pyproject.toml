[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latin-nlp"
version = "0.2.0"
description = "Structured Latin NLP: lexer, morphological stemmer/lemmatizer, dictionary, and syntax parser"
requires-python = ">=3.11"
dependencies = ["fastapi", "pydantic>=2", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
latin-nlp = "latin_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
